name: Android Build

on:
  push:
    branches:
      - main
    tags:
      - 'android-v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches: [ main ]
    paths:
      - 'AIDictationAndroid/**'
      - 'docs/audio-processing-failure-contract.md'
      - 'AGENTS.md'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/android-play-listing.yml'
      - '.github/workflows/android-play-release.yml'

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  ANDROID_PROJECT_DIR: AIDictationAndroid
  PARAKEET_ASSETS_RELEASE_TAG: android-parakeet-assets-v3
  PARAKEET_ASSETS_ARCHIVE: AIDictation-Parakeet-Assets-v3.zip
  # The hosted sign-in page issues sessions for this same account/profile API.
  # Keep release artifacts independent of stale shared Supabase secrets.
  SUPABASE_URL: https://aidictation.com
  SUPABASE_ANON_KEY: public-anon-key
  AUTH_WEB_URL: https://aidictation.com/auth

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    # Every credential this job reads lives in the release environment, not at
    # repo level. Without this the secrets silently resolve to empty strings and
    # the debug APK ships with no auth config and no transcription key.
    environment: release

    defaults:
      run:
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}

    env:
      # Writingmate transcription API
      TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
      TRANSCRIPTION_ENDPOINT: ${{ secrets.TRANSCRIPTION_ENDPOINT }}
      TRANSCRIPTION_MODEL: ${{ secrets.TRANSCRIPTION_MODEL }}
      # Writingmate LLM API (word suggestions / cleanup)
      AIDICTATION_POST_PROCESSING_KEY: ${{ secrets.AIDICTATION_POST_PROCESSING_KEY }}
      AIDICTATION_POST_PROCESSING_ENDPOINT: ${{ secrets.AIDICTATION_POST_PROCESSING_ENDPOINT }}
      AIDICTATION_POST_PROCESSING_MODEL: ${{ secrets.AIDICTATION_POST_PROCESSING_MODEL }}
      STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}
      STRIPE_PAYMENT_LINK_MONTHLY: ${{ secrets.STRIPE_PAYMENT_LINK_MONTHLY }}
      STRIPE_PAYMENT_LINK_ANNUAL: ${{ secrets.STRIPE_PAYMENT_LINK_ANNUAL }}
      STRIPE_PAYMENT_LINK_LIFETIME: ${{ secrets.STRIPE_PAYMENT_LINK_LIFETIME }}
      # Shared macOS Secrets.plist (base64). If set, the Writingmate key is
      # extracted from CustomTranscriptionKey so both platforms share one secret.
      SECRETS_PLIST: ${{ secrets.SECRETS_PLIST }}
      # Release signing
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          ref: ${{ github.sha }}

      - name: Verify checked out commit
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ]; then
            echo "Android build checkout $actual_sha does not match event commit $GITHUB_SHA." >&2
            exit 1
          fi

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('AIDictationAndroid/**/*.gradle*', 'AIDictationAndroid/gradle/wrapper/gradle-wrapper.properties', 'AIDictationAndroid/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Resolve app config from SECRETS_PLIST
        if: env.SECRETS_PLIST != ''
        shell: bash
        run: |
          # The macOS release workflow ships a base64-encoded Secrets.plist that
          # holds the shared Writingmate, Supabase, auth, and Stripe config.
          # Reuse it here so a single repo secret drives both platforms. Only
          # fills fields that weren't set via dedicated Android secrets.
          echo "$SECRETS_PLIST" | base64 -d > /tmp/secrets.plist
          extract() {
            python3 - "$1" <<'PY'
          import plistlib, sys
          with open("/tmp/secrets.plist", "rb") as f:
              print(plistlib.load(f).get(sys.argv[1], "") or "")
          PY
          }
          wm_key=$(extract CustomTranscriptionKey)
          wm_endpoint=$(extract CustomTranscriptionEndpoint)
          wm_model=$(extract CustomTranscriptionModel)
          pp_key=$(extract AIDictationPostProcessingKey)
          pp_endpoint=$(extract AIDictationPostProcessingEndpoint)
          pp_model=$(extract AIDictationPostProcessingModel)
          supabase_url=$(extract SUPABASE_URL)
          supabase_anon_key=$(extract SUPABASE_ANON_KEY)
          auth_web_url=$(extract AUTH_WEB_URL)
          stripe_link=$(extract STRIPE_PAYMENT_LINK)
          stripe_monthly=$(extract STRIPE_PAYMENT_LINK_MONTHLY)
          stripe_annual=$(extract STRIPE_PAYMENT_LINK_ANNUAL)
          stripe_lifetime=$(extract STRIPE_PAYMENT_LINK_LIFETIME)
          if [ -z "$TRANSCRIPTION_API_KEY" ] && [ -n "$wm_key" ]; then
            echo "TRANSCRIPTION_API_KEY=$wm_key" >> "$GITHUB_ENV"
          fi
          if [ -z "$TRANSCRIPTION_ENDPOINT" ] && [ -n "$wm_endpoint" ]; then
            echo "TRANSCRIPTION_ENDPOINT=$wm_endpoint" >> "$GITHUB_ENV"
          fi
          if [ -z "$TRANSCRIPTION_MODEL" ] && [ -n "$wm_model" ]; then
            echo "TRANSCRIPTION_MODEL=$wm_model" >> "$GITHUB_ENV"
          fi
          if [ -z "$AIDICTATION_POST_PROCESSING_KEY" ] && [ -n "$pp_key" ]; then
            echo "AIDICTATION_POST_PROCESSING_KEY=$pp_key" >> "$GITHUB_ENV"
          fi
          if [ -z "$AIDICTATION_POST_PROCESSING_ENDPOINT" ] && [ -n "$pp_endpoint" ]; then
            echo "AIDICTATION_POST_PROCESSING_ENDPOINT=$pp_endpoint" >> "$GITHUB_ENV"
          fi
          if [ -z "$AIDICTATION_POST_PROCESSING_MODEL" ] && [ -n "$pp_model" ]; then
            echo "AIDICTATION_POST_PROCESSING_MODEL=$pp_model" >> "$GITHUB_ENV"
          fi
          if [ -z "$SUPABASE_URL" ] && [ -z "$SUPABASE_ANON_KEY" ] && [ -z "$AUTH_WEB_URL" ]; then
            if [ -n "$supabase_url" ] && [ -n "$supabase_anon_key" ] && [ -n "$auth_web_url" ]; then
              echo "SUPABASE_URL=$supabase_url" >> "$GITHUB_ENV"
              echo "SUPABASE_ANON_KEY=$supabase_anon_key" >> "$GITHUB_ENV"
              echo "AUTH_WEB_URL=$auth_web_url" >> "$GITHUB_ENV"
            elif [ -n "$supabase_url$supabase_anon_key$auth_web_url" ]; then
              echo "SECRETS_PLIST must contain SUPABASE_URL, SUPABASE_ANON_KEY, and AUTH_WEB_URL together." >&2
              exit 1
            fi
          fi
          if [ -z "$STRIPE_PAYMENT_LINK" ] && [ -n "$stripe_link" ]; then
            echo "STRIPE_PAYMENT_LINK=$stripe_link" >> "$GITHUB_ENV"
          fi
          if [ -z "$STRIPE_PAYMENT_LINK_MONTHLY" ] && [ -n "$stripe_monthly" ]; then
            echo "STRIPE_PAYMENT_LINK_MONTHLY=$stripe_monthly" >> "$GITHUB_ENV"
          fi
          if [ -z "$STRIPE_PAYMENT_LINK_ANNUAL" ] && [ -n "$stripe_annual" ]; then
            echo "STRIPE_PAYMENT_LINK_ANNUAL=$stripe_annual" >> "$GITHUB_ENV"
          fi
          if [ -z "$STRIPE_PAYMENT_LINK_LIFETIME" ] && [ -n "$stripe_lifetime" ]; then
            echo "STRIPE_PAYMENT_LINK_LIFETIME=$stripe_lifetime" >> "$GITHUB_ENV"
          fi
          rm /tmp/secrets.plist

      - name: Validate auth configuration
        run: |
          python3 scripts/test_validate_client_config.py
          python3 scripts/validate_client_config.py --allow-missing

      - name: Validate Android release gating contract
        shell: bash
        run: |
          python3 - "$GITHUB_WORKSPACE/.github/workflows/android-play-release.yml" "$GITHUB_WORKSPACE/.github/workflows/android-build.yml" "$GITHUB_WORKSPACE/.github/workflows/android-play-listing.yml" <<'PY'
          from pathlib import Path
          import re
          import sys

          play = Path(sys.argv[1]).read_text()
          build = Path(sys.argv[2]).read_text()
          listing = Path(sys.argv[3]).read_text()
          expression_open = "$" + "{{"

          def require_release_environment(workflow, job_name):
              marker = f"  {job_name}:\n"
              if marker not in workflow:
                  raise SystemExit(f"Android release workflow is missing job {job_name}")
              tail = workflow.split(marker, 1)[1]
              next_job = re.search(r"(?m)^  [A-Za-z0-9_-]+:\n", tail)
              block = tail[:next_job.start()] if next_job else tail
              if "\n    environment: release\n" not in f"\n{block}":
                  raise SystemExit(f"Android release job {job_name} must use the protected release environment")

          required_play_contract = (
              f"PLAY_TRACK: {expression_open} github.event_name == 'push' && 'internal' || inputs.play_track }}",
              f"PLAY_RELEASE_STATUS: {expression_open} github.event_name == 'push' && 'completed' || inputs.release_status }}",
              f"PLAY_PUBLISH_MODE: {expression_open} github.event_name == 'push' && 'upload' || inputs.publish_mode }}",
              f"PUBLISH_GITHUB_RELEASE: {expression_open} github.event_name == 'workflow_dispatch' && inputs.publish_github_release || false }}",
              'if [ "${PLAY_TRACK}" != "internal" ] || [ "${PLAY_RELEASE_STATUS}" != "completed" ] || [ "${PLAY_PUBLISH_MODE}" != "upload" ]; then',
              'if [ "${PUBLISH_GITHUB_RELEASE}" != "false" ]; then',
              'if [ "${PLAY_TRACK}" != "production" ] || [ "${PLAY_PROMOTE_FROM_TRACK}" != "internal" ] || [ "${PLAY_RELEASE_STATUS}" != "inProgress" ]; then',
              'if mode == "promote" and fraction > Decimal("0.10"):',
              '--user-fraction="${PLAY_USER_FRACTION}"',
              '--update="${PLAY_TRACK}"',
              "if: env.PLAY_PUBLISH_MODE == 'upload'",
              "needs: publish",
              "inputs.publish_github_release &&",
              "inputs.release_status == 'completed' &&",
              "inputs.publish_mode == 'complete'",
              'gh release edit "${RELEASE_TAG}"',
              "--draft=false",
          )
          missing = [entry for entry in required_play_contract if entry not in play]
          if missing:
              raise SystemExit(f"Android Play release gate is missing: {missing}")
          if "vars.ANDROID_PLAY_TRACK" in play or "vars.ANDROID_PLAY_RELEASE_STATUS" in play:
              raise SystemExit("Repository variables must not redirect a tag-triggered Play release")

          require_release_environment(play, "publish")
          require_release_environment(build, "release")
          require_release_environment(listing, "publish-listing")

          release_marker = "- name: Create or update " + "draft GitHub Release"
          release_block = build.split(release_marker, 1)
          if len(release_block) != 2 or "gh release create" not in release_block[1] or "--draft" not in release_block[1]:
              raise SystemExit("Tag release creation must remain draft-only")
          if "--draft=false" in release_block[1]:
              raise SystemExit("Tag workflow must not publish a GitHub release")

          print("Android tag releases are internal-only and GitHub draft-only.")
          PY

      - name: Write local.properties
        run: |
          normalize_transcription_model() {
            case "$1" in
              ""|*"gpt-4o-transcribe"*)
                printf '%s\n' "groq/whisper-large-v3-turbo"
                ;;
              *)
                printf '%s\n' "$1"
                ;;
            esac
          }
          TRANSCRIPTION_MODEL="$(normalize_transcription_model "${TRANSCRIPTION_MODEL:-}")"
          AUTH_WEB_URL_VALUE="${AUTH_WEB_URL:-https://aidictation.com/auth}"
          if [ "${AUTH_WEB_URL_VALUE%/}" = "https://voicesinmyhead.co/auth" ]; then
            AUTH_WEB_URL_VALUE=https://aidictation.com/auth
          fi
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          TRANSCRIPTION_API_KEY=${TRANSCRIPTION_API_KEY}
          TRANSCRIPTION_ENDPOINT=${TRANSCRIPTION_ENDPOINT:-https://writingmate.ai/api/openai/v1/audio/transcriptions}
          TRANSCRIPTION_MODEL=${TRANSCRIPTION_MODEL:-groq/whisper-large-v3-turbo}
          AIDICTATION_POST_PROCESSING_KEY=${AIDICTATION_POST_PROCESSING_KEY}
          AIDICTATION_POST_PROCESSING_ENDPOINT=${AIDICTATION_POST_PROCESSING_ENDPOINT:-https://writingmate.ai/api/openai/v1/chat/completions}
          AIDICTATION_POST_PROCESSING_MODEL=${AIDICTATION_POST_PROCESSING_MODEL:-openai/gpt-oss-20b}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          AUTH_WEB_URL=${AUTH_WEB_URL_VALUE}
          STRIPE_PAYMENT_LINK=${STRIPE_PAYMENT_LINK}
          STRIPE_PAYMENT_LINK_MONTHLY=${STRIPE_PAYMENT_LINK_MONTHLY}
          STRIPE_PAYMENT_LINK_ANNUAL=${STRIPE_PAYMENT_LINK_ANNUAL}
          STRIPE_PAYMENT_LINK_LIFETIME=${STRIPE_PAYMENT_LINK_LIFETIME}
          KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          KEY_ALIAS=${KEY_ALIAS:-release}
          KEY_PASSWORD=${KEY_PASSWORD}
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aidictation-debug-apk
          path: AIDictationAndroid/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    name: Release (signed)
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}

    env:
      TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
      TRANSCRIPTION_ENDPOINT: ${{ secrets.TRANSCRIPTION_ENDPOINT }}
      TRANSCRIPTION_MODEL: ${{ secrets.TRANSCRIPTION_MODEL }}
      AIDICTATION_POST_PROCESSING_KEY: ${{ secrets.AIDICTATION_POST_PROCESSING_KEY }}
      AIDICTATION_POST_PROCESSING_ENDPOINT: ${{ secrets.AIDICTATION_POST_PROCESSING_ENDPOINT }}
      AIDICTATION_POST_PROCESSING_MODEL: ${{ secrets.AIDICTATION_POST_PROCESSING_MODEL }}
      STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}
      STRIPE_PAYMENT_LINK_MONTHLY: ${{ secrets.STRIPE_PAYMENT_LINK_MONTHLY }}
      STRIPE_PAYMENT_LINK_ANNUAL: ${{ secrets.STRIPE_PAYMENT_LINK_ANNUAL }}
      STRIPE_PAYMENT_LINK_LIFETIME: ${{ secrets.STRIPE_PAYMENT_LINK_LIFETIME }}
      SECRETS_PLIST: ${{ secrets.SECRETS_PLIST }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          ref: ${{ github.sha }}

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          version_name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p; s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*configValue\("VERSION_NAME", "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          version_code=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p; s/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*configValue\("VERSION_CODE", "([0-9]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "Could not read Android versionName/versionCode from app/build.gradle.kts" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Android releases must be created by pushing an android-v<versionName> tag." >&2
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"
          expected_tag="android-v${version_name}"
          if [ "$tag" != "$expected_tag" ]; then
            echo "Tag $tag does not match Android versionName $version_name; expected $expected_tag." >&2
            exit 1
          fi
          tag_sha=$(git rev-list -n 1 "refs/tags/$tag")
          actual_sha=$(git rev-parse HEAD)
          if [ "$actual_sha" != "$GITHUB_SHA" ] || [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release checkout ($actual_sha) or tag ($tag_sha) does not match event commit $GITHUB_SHA." >&2
            exit 1
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "title=AIDictation Android ${version_name} (${version_code})" >> "$GITHUB_OUTPUT"

      - name: Guard main release tag
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_TAG_SHA: ${{ steps.release_meta.outputs.tag_sha }}
        run: |
          git fetch origin main --prune
          if ! git merge-base --is-ancestor "$RELEASE_TAG_SHA" origin/main; then
            echo "Release tag $RELEASE_TAG points to $RELEASE_TAG_SHA, which is not on origin/main." >&2
            echo "Merge to main first, then tag the main commit." >&2
            exit 1
          fi

      - name: Download Parakeet model assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive_dir=/tmp/parakeet-assets
          rm -rf "$archive_dir" parakeetpack/src/main/assets
          mkdir -p "$archive_dir" parakeetpack/src/main/assets
          gh release download "$PARAKEET_ASSETS_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$PARAKEET_ASSETS_ARCHIVE" \
            --dir "$archive_dir"
          unzip -q "$archive_dir/$PARAKEET_ASSETS_ARCHIVE" -d parakeetpack/src/main/assets
          test -s parakeetpack/src/main/assets/encoder-model.int8.onnx
          test -s parakeetpack/src/main/assets/decoder_joint-model.int8.onnx
          test -s parakeetpack/src/main/assets/nemo128.onnx
          test -s parakeetpack/src/main/assets/vocab.txt
          test -s parakeetpack/src/main/assets/config.json

      - name: Report secret presence
        run: |
          present() { [ -n "$1" ] && echo SET || echo MISSING; }
          echo "TRANSCRIPTION_API_KEY:     $(present "$TRANSCRIPTION_API_KEY")"
          echo "TRANSCRIPTION_ENDPOINT:    $(present "$TRANSCRIPTION_ENDPOINT")"
          echo "TRANSCRIPTION_MODEL:       $(present "$TRANSCRIPTION_MODEL")"
          echo "AIDICTATION_POST_PROCESSING_KEY:      $(present "$AIDICTATION_POST_PROCESSING_KEY")"
          echo "AIDICTATION_POST_PROCESSING_ENDPOINT: $(present "$AIDICTATION_POST_PROCESSING_ENDPOINT")"
          echo "AIDICTATION_POST_PROCESSING_MODEL:    $(present "$AIDICTATION_POST_PROCESSING_MODEL")"
          echo "SUPABASE_URL:            $(present "$SUPABASE_URL")"
          echo "SUPABASE_ANON_KEY:       $(present "$SUPABASE_ANON_KEY")"
          echo "AUTH_WEB_URL:            $(present "$AUTH_WEB_URL")"
          echo "STRIPE_PAYMENT_LINK:     $(present "$STRIPE_PAYMENT_LINK")"
          echo "STRIPE_PAYMENT_LINK_MONTHLY:  $(present "$STRIPE_PAYMENT_LINK_MONTHLY")"
          echo "STRIPE_PAYMENT_LINK_ANNUAL:   $(present "$STRIPE_PAYMENT_LINK_ANNUAL")"
          echo "STRIPE_PAYMENT_LINK_LIFETIME: $(present "$STRIPE_PAYMENT_LINK_LIFETIME")"
          echo "SECRETS_PLIST:             $(present "$SECRETS_PLIST")"
          echo "ANDROID_KEYSTORE_BASE64:   $(present "$ANDROID_KEYSTORE_BASE64")"
          echo "ANDROID_KEYSTORE_PASSWORD: $(present "$KEYSTORE_PASSWORD")"
          echo "ANDROID_KEY_ALIAS:         $(present "$KEY_ALIAS")"
          echo "ANDROID_KEY_PASSWORD:      $(present "$KEY_PASSWORD")"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('AIDictationAndroid/**/*.gradle*', 'AIDictationAndroid/gradle/wrapper/gradle-wrapper.properties', 'AIDictationAndroid/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Resolve app config from SECRETS_PLIST
        if: env.SECRETS_PLIST != ''
        shell: bash
        run: |
          echo "$SECRETS_PLIST" | base64 -d > /tmp/secrets.plist
          extract() {
            python3 - "$1" <<'PY'
          import plistlib, sys
          with open("/tmp/secrets.plist", "rb") as f:
              print(plistlib.load(f).get(sys.argv[1], "") or "")
          PY
          }
          wm_key=$(extract CustomTranscriptionKey)
          wm_endpoint=$(extract CustomTranscriptionEndpoint)
          wm_model=$(extract CustomTranscriptionModel)
          pp_key=$(extract AIDictationPostProcessingKey)
          pp_endpoint=$(extract AIDictationPostProcessingEndpoint)
          pp_model=$(extract AIDictationPostProcessingModel)
          supabase_url=$(extract SUPABASE_URL)
          supabase_anon_key=$(extract SUPABASE_ANON_KEY)
          auth_web_url=$(extract AUTH_WEB_URL)
          stripe_link=$(extract STRIPE_PAYMENT_LINK)
          stripe_monthly=$(extract STRIPE_PAYMENT_LINK_MONTHLY)
          stripe_annual=$(extract STRIPE_PAYMENT_LINK_ANNUAL)
          stripe_lifetime=$(extract STRIPE_PAYMENT_LINK_LIFETIME)
          if [ -z "$TRANSCRIPTION_API_KEY" ] && [ -n "$wm_key" ]; then
            echo "TRANSCRIPTION_API_KEY=$wm_key" >> "$GITHUB_ENV"
          fi
          if [ -z "$TRANSCRIPTION_ENDPOINT" ] && [ -n "$wm_endpoint" ]; then
            echo "TRANSCRIPTION_ENDPOINT=$wm_endpoint" >> "$GITHUB_ENV"
          fi
          if [ -z "$TRANSCRIPTION_MODEL" ] && [ -n "$wm_model" ]; then
            echo "TRANSCRIPTION_MODEL=$wm_model" >> "$GITHUB_ENV"
          fi
          if [ -z "$AIDICTATION_POST_PROCESSING_KEY" ] && [ -n "$pp_key" ]; then
            echo "AIDICTATION_POST_PROCESSING_KEY=$pp_key" >> "$GITHUB_ENV"
          fi
          if [ -z "$AIDICTATION_POST_PROCESSING_ENDPOINT" ] && [ -n "$pp_endpoint" ]; then
            echo "AIDICTATION_POST_PROCESSING_ENDPOINT=$pp_endpoint" >> "$GITHUB_ENV"
          fi
          if [ -z "$AIDICTATION_POST_PROCESSING_MODEL" ] && [ -n "$pp_model" ]; then
            echo "AIDICTATION_POST_PROCESSING_MODEL=$pp_model" >> "$GITHUB_ENV"
          fi
          if [ -z "$SUPABASE_URL" ] && [ -z "$SUPABASE_ANON_KEY" ] && [ -z "$AUTH_WEB_URL" ]; then
            if [ -n "$supabase_url" ] && [ -n "$supabase_anon_key" ] && [ -n "$auth_web_url" ]; then
              echo "SUPABASE_URL=$supabase_url" >> "$GITHUB_ENV"
              echo "SUPABASE_ANON_KEY=$supabase_anon_key" >> "$GITHUB_ENV"
              echo "AUTH_WEB_URL=$auth_web_url" >> "$GITHUB_ENV"
            elif [ -n "$supabase_url$supabase_anon_key$auth_web_url" ]; then
              echo "SECRETS_PLIST must contain SUPABASE_URL, SUPABASE_ANON_KEY, and AUTH_WEB_URL together." >&2
              exit 1
            fi
          fi
          if [ -z "$STRIPE_PAYMENT_LINK" ] && [ -n "$stripe_link" ]; then
            echo "STRIPE_PAYMENT_LINK=$stripe_link" >> "$GITHUB_ENV"
          fi
          if [ -z "$STRIPE_PAYMENT_LINK_MONTHLY" ] && [ -n "$stripe_monthly" ]; then
            echo "STRIPE_PAYMENT_LINK_MONTHLY=$stripe_monthly" >> "$GITHUB_ENV"
          fi
          if [ -z "$STRIPE_PAYMENT_LINK_ANNUAL" ] && [ -n "$stripe_annual" ]; then
            echo "STRIPE_PAYMENT_LINK_ANNUAL=$stripe_annual" >> "$GITHUB_ENV"
          fi
          if [ -z "$STRIPE_PAYMENT_LINK_LIFETIME" ] && [ -n "$stripe_lifetime" ]; then
            echo "STRIPE_PAYMENT_LINK_LIFETIME=$stripe_lifetime" >> "$GITHUB_ENV"
          fi
          rm /tmp/secrets.plist

      - name: Validate release client configuration
        run: python3 scripts/validate_client_config.py

      - name: Write local.properties
        run: |
          normalize_transcription_model() {
            case "$1" in
              ""|*"gpt-4o-transcribe"*)
                printf '%s\n' "groq/whisper-large-v3-turbo"
                ;;
              *)
                printf '%s\n' "$1"
                ;;
            esac
          }
          TRANSCRIPTION_MODEL="$(normalize_transcription_model "${TRANSCRIPTION_MODEL:-}")"
          AUTH_WEB_URL_VALUE="${AUTH_WEB_URL:-https://aidictation.com/auth}"
          if [ "${AUTH_WEB_URL_VALUE%/}" = "https://voicesinmyhead.co/auth" ]; then
            AUTH_WEB_URL_VALUE=https://aidictation.com/auth
          fi
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          TRANSCRIPTION_API_KEY=${TRANSCRIPTION_API_KEY}
          TRANSCRIPTION_ENDPOINT=${TRANSCRIPTION_ENDPOINT:-https://writingmate.ai/api/openai/v1/audio/transcriptions}
          TRANSCRIPTION_MODEL=${TRANSCRIPTION_MODEL:-groq/whisper-large-v3-turbo}
          AIDICTATION_POST_PROCESSING_KEY=${AIDICTATION_POST_PROCESSING_KEY}
          AIDICTATION_POST_PROCESSING_ENDPOINT=${AIDICTATION_POST_PROCESSING_ENDPOINT:-https://writingmate.ai/api/openai/v1/chat/completions}
          AIDICTATION_POST_PROCESSING_MODEL=${AIDICTATION_POST_PROCESSING_MODEL:-openai/gpt-oss-20b}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          AUTH_WEB_URL=${AUTH_WEB_URL_VALUE}
          STRIPE_PAYMENT_LINK=${STRIPE_PAYMENT_LINK}
          STRIPE_PAYMENT_LINK_MONTHLY=${STRIPE_PAYMENT_LINK_MONTHLY}
          STRIPE_PAYMENT_LINK_ANNUAL=${STRIPE_PAYMENT_LINK_ANNUAL}
          STRIPE_PAYMENT_LINK_LIFETIME=${STRIPE_PAYMENT_LINK_LIFETIME}
          KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          KEY_ALIAS=${KEY_ALIAS:-release}
          KEY_PASSWORD=${KEY_PASSWORD}
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Bundle release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Collect release assets
        run: |
          tag="${{ steps.release_meta.outputs.tag }}"
          artifact_version="${tag#android-v}"
          mkdir -p release-artifacts
          apk_path=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          aab_path=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | head -n 1)
          if [ -z "$apk_path" ] || [ -z "$aab_path" ]; then
            echo "Release APK or AAB was not produced" >&2
            exit 1
          fi
          cp "$apk_path" "release-artifacts/AIDictation-Android-${artifact_version}.apk"
          cp "$aab_path" "release-artifacts/AIDictation-Android-${artifact_version}.aab"
          (
            cd release-artifacts
            shasum -a 256 *.apk > "AIDictation-Android-${artifact_version}.apk.sha256"
            shasum -a 256 *.aab > "AIDictation-Android-${artifact_version}.aab.sha256"
            shasum -a 256 *.apk *.aab > SHA256SUMS.txt
          )
          ls -lh release-artifacts

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aidictation-release-apk
          path: AIDictationAndroid/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: aidictation-release-aab
          path: AIDictationAndroid/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_TAG_SHA: ${{ steps.release_meta.outputs.tag_sha }}
          RELEASE_TITLE: ${{ steps.release_meta.outputs.title }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ] || [ "$RELEASE_TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Refusing to stage artifacts not built from event commit $GITHUB_SHA." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to modify already-public release $RELEASE_TAG from a tag build." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-artifacts/* \
              --target "$RELEASE_TAG_SHA" \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              --draft \
              --repo "$GITHUB_REPOSITORY"
          fi
          is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$is_draft" != "true" ]; then
            echo "Tag build must leave release $RELEASE_TAG in draft state." >&2
            exit 1
          fi
