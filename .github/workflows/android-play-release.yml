name: Android Play Release

on:
  push:
    tags:
      - 'android-v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Android release tag to publish, for example android-v0.0.19'
        required: true
        type: string
      play_track:
        description: 'Google Play track'
        required: true
        default: production
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: 'Google Play release status'
        required: true
        default: inProgress
        type: choice
        options:
          - inProgress
          - halted
          - completed
      publish_mode:
        description: 'Upload internally, or start, update, halt, or complete the production rollout'
        required: true
        default: promote
        type: choice
        options:
          - upload
          - promote
          - update
          - halt
          - complete
      promote_from_track:
        description: 'Source track when publish_mode is promote'
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      rollout_fraction:
        description: 'Production fraction for staged promote/update actions'
        required: true
        default: '0.05'
        type: choice
        options:
          - '0.01'
          - '0.05'
          - '0.10'
          - '0.25'
          - '0.50'
          - '0.75'
      publish_github_release:
        description: 'Publish the existing draft GitHub release only after explicit production completion'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-play-release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  ANDROID_PROJECT_DIR: AIDictationAndroid
  PARAKEET_ASSETS_RELEASE_TAG: android-parakeet-assets-v3
  PARAKEET_ASSETS_ARCHIVE: AIDictation-Parakeet-Assets-v3.zip
  # Browser sign-in and native account/profile requests must share an origin.
  SUPABASE_URL: https://aidictation.com
  SUPABASE_ANON_KEY: public-anon-key
  AUTH_WEB_URL: https://aidictation.com/auth

jobs:
  publish:
    name: Publish signed AAB to Play
    runs-on: ubuntu-latest
    environment: release

    defaults:
      run:
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}

    env:
      PLAY_TRACK: ${{ github.event_name == 'push' && 'internal' || inputs.play_track }}
      PLAY_RELEASE_STATUS: ${{ github.event_name == 'push' && 'completed' || inputs.release_status }}
      PLAY_PUBLISH_MODE: ${{ github.event_name == 'push' && 'upload' || inputs.publish_mode }}
      PLAY_PROMOTE_FROM_TRACK: ${{ github.event_name == 'push' && 'internal' || inputs.promote_from_track }}
      PLAY_USER_FRACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.rollout_fraction || '0.05' }}
      PUBLISH_GITHUB_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_github_release || false }}
      PLAY_RELEASE_NAME: ''
      PARAKEET_RUNTIME: onnx

      # Google Play API credentials. Prefer the base64 secret for copy/paste
      # safety; raw ANDROID_PUBLISHER_CREDENTIALS is also supported.
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
      ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}

      # Writingmate transcription API
      TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
      TRANSCRIPTION_ENDPOINT: ${{ secrets.TRANSCRIPTION_ENDPOINT }}
      TRANSCRIPTION_MODEL: ${{ secrets.TRANSCRIPTION_MODEL }}

      # Writingmate LLM API
      AIDICTATION_POST_PROCESSING_KEY: ${{ secrets.AIDICTATION_POST_PROCESSING_KEY }}
      AIDICTATION_POST_PROCESSING_ENDPOINT: ${{ secrets.AIDICTATION_POST_PROCESSING_ENDPOINT }}
      AIDICTATION_POST_PROCESSING_MODEL: ${{ secrets.AIDICTATION_POST_PROCESSING_MODEL }}
      STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}
      STRIPE_PAYMENT_LINK_MONTHLY: ${{ secrets.STRIPE_PAYMENT_LINK_MONTHLY }}
      STRIPE_PAYMENT_LINK_ANNUAL: ${{ secrets.STRIPE_PAYMENT_LINK_ANNUAL }}
      STRIPE_PAYMENT_LINK_LIFETIME: ${{ secrets.STRIPE_PAYMENT_LINK_LIFETIME }}
      SECRETS_PLIST: ${{ secrets.SECRETS_PLIST }}

      # Release signing
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ "${PLAY_TRACK}" != "internal" ] || [ "${PLAY_RELEASE_STATUS}" != "completed" ] || [ "${PLAY_PUBLISH_MODE}" != "upload" ]; then
              echo "Tag-triggered releases must upload to the internal track with completed status." >&2
              exit 1
            fi
            if [ "${PUBLISH_GITHUB_RELEASE}" != "false" ]; then
              echo "Tag-triggered releases cannot publish the draft GitHub release." >&2
              exit 1
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${PLAY_PUBLISH_MODE}" in
              upload)
                if [ "${PLAY_TRACK}" = "production" ] || [ "${PLAY_RELEASE_STATUS}" != "completed" ]; then
                  echo "Manual uploads must be completed releases on a non-production track." >&2
                  exit 1
                fi
                ;;
              promote)
                if [ "${PLAY_TRACK}" != "production" ] || [ "${PLAY_PROMOTE_FROM_TRACK}" != "internal" ] || [ "${PLAY_RELEASE_STATUS}" != "inProgress" ]; then
                  echo "Initial production rollout must promote internal to production with inProgress status." >&2
                  exit 1
                fi
                ;;
              update)
                if [ "${PLAY_TRACK}" != "production" ] || [ "${PLAY_RELEASE_STATUS}" != "inProgress" ]; then
                  echo "Rollout updates must keep the production release inProgress." >&2
                  exit 1
                fi
                ;;
              halt)
                if [ "${PLAY_TRACK}" != "production" ] || [ "${PLAY_RELEASE_STATUS}" != "halted" ]; then
                  echo "Rollout halt must target production with halted status." >&2
                  exit 1
                fi
                ;;
              complete)
                if [ "${PLAY_TRACK}" != "production" ] || [ "${PLAY_RELEASE_STATUS}" != "completed" ]; then
                  echo "Rollout completion must target production with completed status." >&2
                  exit 1
                fi
                ;;
              *)
                echo "Unsupported PLAY_PUBLISH_MODE '${PLAY_PUBLISH_MODE}'." >&2
                exit 1
                ;;
            esac

            if [ "${PLAY_PUBLISH_MODE}" = "promote" ] || [ "${PLAY_PUBLISH_MODE}" = "update" ]; then
              python3 - "${PLAY_USER_FRACTION}" "${PLAY_PUBLISH_MODE}" <<'PY'
          from decimal import Decimal, InvalidOperation
          import sys

          try:
              fraction = Decimal(sys.argv[1])
          except InvalidOperation as exc:
              raise SystemExit(f"Invalid rollout fraction: {sys.argv[1]}") from exc

          mode = sys.argv[2]
          if not Decimal("0") < fraction < Decimal("1"):
              raise SystemExit("Rollout fraction must be greater than 0 and less than 1")
          if mode == "promote" and fraction > Decimal("0.10"):
              raise SystemExit("Initial production rollout is capped at 10%")
          PY
            fi

            if [ "${PUBLISH_GITHUB_RELEASE}" = "true" ] && { [ "${PLAY_TRACK}" != "production" ] || [ "${PLAY_RELEASE_STATUS}" != "completed" ] || [ "${PLAY_PUBLISH_MODE}" != "complete" ]; }; then
              echo "Publishing the GitHub release requires explicit completion of the production rollout." >&2
              exit 1
            fi
          else
            echo "Unsupported release event ${GITHUB_EVENT_NAME}." >&2
            exit 1
          fi

          case "${PLAY_TRACK}" in
            internal|alpha|beta|production) ;;
            *)
              echo "Unsupported PLAY_TRACK '${PLAY_TRACK}'. Use internal, alpha, beta, or production." >&2
              exit 1
              ;;
          esac
          case "${PLAY_RELEASE_STATUS}" in
            completed|draft|inProgress|halted) ;;
            *)
              echo "Unsupported PLAY_RELEASE_STATUS '${PLAY_RELEASE_STATUS}'. Use completed, draft, inProgress, or halted." >&2
              exit 1
              ;;
          esac

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.release_tag }}"
          else
            if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
              echo "Play releases must be created by pushing an android-v<versionName> tag." >&2
              exit 1
            fi
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "$release_tag" ]; then
            echo "release_tag is required." >&2
            exit 1
          fi

          version_name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p; s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*configValue\("VERSION_NAME", "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          version_code=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p; s/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*configValue\("VERSION_CODE", "([0-9]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "Could not read Android versionName/versionCode from app/build.gradle.kts" >&2
            exit 1
          fi

          expected_tag="android-v${version_name}"
          if [ "$release_tag" != "$expected_tag" ]; then
            echo "Tag $release_tag does not match Android versionName $version_name; expected $expected_tag." >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$release_tag^{commit}" >/dev/null; then
            echo "Release tag $release_tag does not exist." >&2
            exit 1
          fi
          tag_sha=$(git rev-list -n 1 "refs/tags/$release_tag")
          actual_sha=$(git rev-parse HEAD)
          if [ "$actual_sha" != "$tag_sha" ]; then
            echo "Play release checkout $actual_sha does not match tag $release_tag at $tag_sha." >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag $release_tag does not match push event commit $GITHUB_SHA." >&2
            exit 1
          fi
          git fetch origin main --prune
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "Release tag $release_tag points to $tag_sha, which is not on origin/main." >&2
            echo "Merge to main first, then tag the main commit." >&2
            exit 1
          fi

          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "PLAY_RELEASE_NAME=AIDictation Android ${version_name} (${version_code})" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "RELEASE_TAG_SHA=$tag_sha" >> "$GITHUB_ENV"

      - name: Download Parakeet model assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive_dir=/tmp/parakeet-assets
          rm -rf "$archive_dir" parakeetpack/src/main/assets
          mkdir -p "$archive_dir" parakeetpack/src/main/assets
          gh release download "$PARAKEET_ASSETS_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$PARAKEET_ASSETS_ARCHIVE" \
            --dir "$archive_dir"
          unzip -q "$archive_dir/$PARAKEET_ASSETS_ARCHIVE" -d parakeetpack/src/main/assets
          test -s parakeetpack/src/main/assets/encoder-model.int8.onnx
          test -s parakeetpack/src/main/assets/decoder_joint-model.int8.onnx
          test -s parakeetpack/src/main/assets/nemo128.onnx
          test -s parakeetpack/src/main/assets/vocab.txt
          test -s parakeetpack/src/main/assets/config.json

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('AIDictationAndroid/**/*.gradle*', 'AIDictationAndroid/gradle/wrapper/gradle-wrapper.properties', 'AIDictationAndroid/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode release keystore
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is required to publish to Play." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Decode Google Play credentials
        run: |
          credentials_path="$RUNNER_TEMP/google-play-service-account.json"
          if [ -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64}" ]; then
            echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > "$credentials_path"
          elif [ -n "${ANDROID_PUBLISHER_CREDENTIALS}" ]; then
            printf '%s' "$ANDROID_PUBLISHER_CREDENTIALS" > "$credentials_path"
          else
            echo "Set GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 or ANDROID_PUBLISHER_CREDENTIALS." >&2
            exit 1
          fi
          python3 -m json.tool "$credentials_path" >/dev/null
          echo "PLAY_SERVICE_ACCOUNT_CREDENTIALS=$credentials_path" >> "$GITHUB_ENV"

      - name: Resolve app config from SECRETS_PLIST
        if: env.SECRETS_PLIST != ''
        shell: bash
        run: |
          echo "$SECRETS_PLIST" | base64 -d > /tmp/secrets.plist
          extract() {
            python3 - "$1" <<'PY'
          import plistlib, sys
          with open("/tmp/secrets.plist", "rb") as f:
              print(plistlib.load(f).get(sys.argv[1], "") or "")
          PY
          }
          wm_key=$(extract CustomTranscriptionKey)
          wm_endpoint=$(extract CustomTranscriptionEndpoint)
          wm_model=$(extract CustomTranscriptionModel)
          pp_key=$(extract AIDictationPostProcessingKey)
          pp_endpoint=$(extract AIDictationPostProcessingEndpoint)
          pp_model=$(extract AIDictationPostProcessingModel)
          supabase_url=$(extract SUPABASE_URL)
          supabase_anon_key=$(extract SUPABASE_ANON_KEY)
          auth_web_url=$(extract AUTH_WEB_URL)
          stripe_link=$(extract STRIPE_PAYMENT_LINK)
          stripe_monthly=$(extract STRIPE_PAYMENT_LINK_MONTHLY)
          stripe_annual=$(extract STRIPE_PAYMENT_LINK_ANNUAL)
          stripe_lifetime=$(extract STRIPE_PAYMENT_LINK_LIFETIME)
          if [ -z "$TRANSCRIPTION_API_KEY" ] && [ -n "$wm_key" ]; then
            echo "TRANSCRIPTION_API_KEY=$wm_key" >> "$GITHUB_ENV"
          fi
          if [ -z "$TRANSCRIPTION_ENDPOINT" ] && [ -n "$wm_endpoint" ]; then
            echo "TRANSCRIPTION_ENDPOINT=$wm_endpoint" >> "$GITHUB_ENV"
          fi
          if [ -z "$TRANSCRIPTION_MODEL" ] && [ -n "$wm_model" ]; then
            echo "TRANSCRIPTION_MODEL=$wm_model" >> "$GITHUB_ENV"
          fi
          if [ -z "$AIDICTATION_POST_PROCESSING_KEY" ] && [ -n "$pp_key" ]; then
            echo "AIDICTATION_POST_PROCESSING_KEY=$pp_key" >> "$GITHUB_ENV"
          fi
          if [ -z "$AIDICTATION_POST_PROCESSING_ENDPOINT" ] && [ -n "$pp_endpoint" ]; then
            echo "AIDICTATION_POST_PROCESSING_ENDPOINT=$pp_endpoint" >> "$GITHUB_ENV"
          fi
          if [ -z "$AIDICTATION_POST_PROCESSING_MODEL" ] && [ -n "$pp_model" ]; then
            echo "AIDICTATION_POST_PROCESSING_MODEL=$pp_model" >> "$GITHUB_ENV"
          fi
          if [ -z "$SUPABASE_URL" ] && [ -z "$SUPABASE_ANON_KEY" ] && [ -z "$AUTH_WEB_URL" ]; then
            if [ -n "$supabase_url" ] && [ -n "$supabase_anon_key" ] && [ -n "$auth_web_url" ]; then
              echo "SUPABASE_URL=$supabase_url" >> "$GITHUB_ENV"
              echo "SUPABASE_ANON_KEY=$supabase_anon_key" >> "$GITHUB_ENV"
              echo "AUTH_WEB_URL=$auth_web_url" >> "$GITHUB_ENV"
            elif [ -n "$supabase_url$supabase_anon_key$auth_web_url" ]; then
              echo "SECRETS_PLIST must contain SUPABASE_URL, SUPABASE_ANON_KEY, and AUTH_WEB_URL together." >&2
              exit 1
            fi
          fi
          if [ -z "$STRIPE_PAYMENT_LINK" ] && [ -n "$stripe_link" ]; then
            echo "STRIPE_PAYMENT_LINK=$stripe_link" >> "$GITHUB_ENV"
          fi
          if [ -z "$STRIPE_PAYMENT_LINK_MONTHLY" ] && [ -n "$stripe_monthly" ]; then
            echo "STRIPE_PAYMENT_LINK_MONTHLY=$stripe_monthly" >> "$GITHUB_ENV"
          fi
          if [ -z "$STRIPE_PAYMENT_LINK_ANNUAL" ] && [ -n "$stripe_annual" ]; then
            echo "STRIPE_PAYMENT_LINK_ANNUAL=$stripe_annual" >> "$GITHUB_ENV"
          fi
          if [ -z "$STRIPE_PAYMENT_LINK_LIFETIME" ] && [ -n "$stripe_lifetime" ]; then
            echo "STRIPE_PAYMENT_LINK_LIFETIME=$stripe_lifetime" >> "$GITHUB_ENV"
          fi
          rm /tmp/secrets.plist

      - name: Validate release client configuration
        run: |
          python3 scripts/test_validate_client_config.py
          python3 scripts/validate_client_config.py

      - name: Write local.properties
        run: |
          normalize_transcription_model() {
            case "$1" in
              ""|*"gpt-4o-transcribe"*)
                printf '%s\n' "groq/whisper-large-v3-turbo"
                ;;
              *)
                printf '%s\n' "$1"
                ;;
            esac
          }
          TRANSCRIPTION_MODEL="$(normalize_transcription_model "${TRANSCRIPTION_MODEL:-}")"
          AUTH_WEB_URL_VALUE="${AUTH_WEB_URL:-https://aidictation.com/auth}"
          if [ "${AUTH_WEB_URL_VALUE%/}" = "https://voicesinmyhead.co/auth" ]; then
            AUTH_WEB_URL_VALUE=https://aidictation.com/auth
          fi
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          VERSION_CODE=${VERSION_CODE}
          VERSION_NAME=${VERSION_NAME}
          TRANSCRIPTION_API_KEY=${TRANSCRIPTION_API_KEY}
          TRANSCRIPTION_ENDPOINT=${TRANSCRIPTION_ENDPOINT:-https://writingmate.ai/api/openai/v1/audio/transcriptions}
          TRANSCRIPTION_MODEL=${TRANSCRIPTION_MODEL:-groq/whisper-large-v3-turbo}
          PARAKEET_RUNTIME=${PARAKEET_RUNTIME}
          AIDICTATION_POST_PROCESSING_KEY=${AIDICTATION_POST_PROCESSING_KEY}
          AIDICTATION_POST_PROCESSING_ENDPOINT=${AIDICTATION_POST_PROCESSING_ENDPOINT:-https://writingmate.ai/api/openai/v1/chat/completions}
          AIDICTATION_POST_PROCESSING_MODEL=${AIDICTATION_POST_PROCESSING_MODEL:-openai/gpt-oss-20b}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          AUTH_WEB_URL=${AUTH_WEB_URL_VALUE}
          STRIPE_PAYMENT_LINK=${STRIPE_PAYMENT_LINK}
          STRIPE_PAYMENT_LINK_MONTHLY=${STRIPE_PAYMENT_LINK_MONTHLY}
          STRIPE_PAYMENT_LINK_ANNUAL=${STRIPE_PAYMENT_LINK_ANNUAL}
          STRIPE_PAYMENT_LINK_LIFETIME=${STRIPE_PAYMENT_LINK_LIFETIME}
          KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          KEY_ALIAS=${KEY_ALIAS:-release}
          KEY_PASSWORD=${KEY_PASSWORD}
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Validate release bundle
        run: |
          ./gradlew :app:bundleRelease -PPARAKEET_RUNTIME="${PARAKEET_RUNTIME}" --stacktrace

      - name: Verify release source before publishing
        run: |
          actual_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          if [ "$actual_sha" != "$RELEASE_TAG_SHA" ] || [ "$tag_sha" != "$RELEASE_TAG_SHA" ]; then
            echo "Refusing to publish artifacts not built from tag $RELEASE_TAG at $RELEASE_TAG_SHA." >&2
            exit 1
          fi

      - name: Publish Play listing assets
        run: |
          ./gradlew \
            :app:publishReleaseListing \
            -PPLAY_TRACK="${PLAY_TRACK}" \
            -PPLAY_SERVICE_ACCOUNT_CREDENTIALS="${PLAY_SERVICE_ACCOUNT_CREDENTIALS}" \
            --stacktrace

      - name: Promote Google Play release
        if: env.PLAY_PUBLISH_MODE == 'promote'
        run: |
          args=(
            :app:promoteReleaseArtifact
            --from-track="${PLAY_PROMOTE_FROM_TRACK}"
            --promote-track="${PLAY_TRACK}"
            --version-code="${VERSION_CODE}"
            -PPLAY_SERVICE_ACCOUNT_CREDENTIALS="${PLAY_SERVICE_ACCOUNT_CREDENTIALS}"
            -PPLAY_RELEASE_STATUS="${PLAY_RELEASE_STATUS}"
            --release-status="${PLAY_RELEASE_STATUS}"
            --user-fraction="${PLAY_USER_FRACTION}"
            --stacktrace
          )
          if [ -n "${PLAY_RELEASE_NAME}" ]; then
            args+=(--release-name="${PLAY_RELEASE_NAME}")
          fi
          ./gradlew "${args[@]}"

      - name: Update staged production rollout
        if: env.PLAY_PUBLISH_MODE == 'update'
        run: |
          ./gradlew \
            :app:promoteReleaseArtifact \
            --update="${PLAY_TRACK}" \
            --version-code="${VERSION_CODE}" \
            --release-status="${PLAY_RELEASE_STATUS}" \
            --user-fraction="${PLAY_USER_FRACTION}" \
            -PPLAY_SERVICE_ACCOUNT_CREDENTIALS="${PLAY_SERVICE_ACCOUNT_CREDENTIALS}" \
            --stacktrace

      - name: Halt staged production rollout
        if: env.PLAY_PUBLISH_MODE == 'halt'
        run: |
          ./gradlew \
            :app:promoteReleaseArtifact \
            --update="${PLAY_TRACK}" \
            --version-code="${VERSION_CODE}" \
            --release-status="${PLAY_RELEASE_STATUS}" \
            -PPLAY_SERVICE_ACCOUNT_CREDENTIALS="${PLAY_SERVICE_ACCOUNT_CREDENTIALS}" \
            --stacktrace

      - name: Complete staged production rollout
        if: env.PLAY_PUBLISH_MODE == 'complete'
        run: |
          ./gradlew \
            :app:promoteReleaseArtifact \
            --update="${PLAY_TRACK}" \
            --version-code="${VERSION_CODE}" \
            --release-status="${PLAY_RELEASE_STATUS}" \
            -PPLAY_SERVICE_ACCOUNT_CREDENTIALS="${PLAY_SERVICE_ACCOUNT_CREDENTIALS}" \
            --stacktrace

      - name: Publish to Google Play
        if: env.PLAY_PUBLISH_MODE == 'upload'
        run: |
          args=(
            :app:publishReleaseBundle
            -PPLAY_TRACK="${PLAY_TRACK}"
            -PPLAY_RELEASE_STATUS="${PLAY_RELEASE_STATUS}"
            -PPLAY_SERVICE_ACCOUNT_CREDENTIALS="${PLAY_SERVICE_ACCOUNT_CREDENTIALS}"
            -PPARAKEET_RUNTIME="${PARAKEET_RUNTIME}"
            --stacktrace
          )
          if [ -n "${PLAY_RELEASE_NAME}" ]; then
            args+=(-PPLAY_RELEASE_NAME="${PLAY_RELEASE_NAME}")
          fi
          ./gradlew "${args[@]}"

  publish_github_release:
    name: Publish verified GitHub release
    needs: publish
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_github_release &&
      inputs.play_track == 'production' &&
      inputs.release_status == 'completed' &&
      inputs.publish_mode == 'complete'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout verified release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          ref: ${{ format('refs/tags/{0}', inputs.release_tag) }}

      - name: Publish existing draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Android release tag ${RELEASE_TAG}." >&2
            exit 1
          fi

          version_name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p; s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*configValue\("VERSION_NAME", "([^"]+)".*/\1/p' AIDictationAndroid/app/build.gradle.kts | head -n 1)
          if [ "${RELEASE_TAG}" != "android-v${version_name}" ]; then
            echo "Tag ${RELEASE_TAG} does not match Android versionName ${version_name}." >&2
            exit 1
          fi

          tag_sha=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
          actual_sha=$(git rev-parse HEAD)
          git fetch origin main --prune
          if [ "${actual_sha}" != "${tag_sha}" ] || ! git merge-base --is-ancestor "${tag_sha}" origin/main; then
            echo "Release tag ${RELEASE_TAG} must be checked out exactly and reachable from origin/main." >&2
            exit 1
          fi

          is_draft=$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)
          if [ "${is_draft}" != "true" ]; then
            echo "Release ${RELEASE_TAG} must exist as a draft before publication." >&2
            exit 1
          fi

          artifact_version="${RELEASE_TAG#android-v}"
          verification_dir="${RUNNER_TEMP}/github-release-verification"
          mkdir -p "${verification_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${verification_dir}"
          test -s "${verification_dir}/AIDictation-Android-${artifact_version}.apk"
          test -s "${verification_dir}/AIDictation-Android-${artifact_version}.aab"
          test -s "${verification_dir}/SHA256SUMS.txt"
          (
            cd "${verification_dir}"
            shasum -a 256 -c SHA256SUMS.txt
          )

          gh release edit "${RELEASE_TAG}" \
            --draft=false \
            --latest \
            --repo "${GITHUB_REPOSITORY}"
          published_draft_state=$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)
          if [ "${published_draft_state}" != "false" ]; then
            echo "Release ${RELEASE_TAG} was not published." >&2
            exit 1
          fi
