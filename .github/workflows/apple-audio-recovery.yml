name: Apple Audio Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'Whishpermate/**'
      - 'scripts/validate_apple_http_audio_recovery.swift'
      - 'scripts/validate_apple_audio_recovery.sh'
      - 'scripts/validate_ios_audio_processing_recovery.swift'
      - 'scripts/validate_keyboard_audio_recovery.swift'
      - 'scripts/validate_macos_audio_processing_store.swift'
      - 'scripts/validate_macos_lifecycle_guards.swift'
      - 'scripts/validate_macos_recording_recovery.swift'
      - 'scripts/validate_macos_preparation_format_retry.swift'
      - 'scripts/validate_macos_transcription_attempt_snapshot.swift'
      - 'scripts/validate_macos_vad_recovery.swift'
      - 'scripts/validate_macos_url_handler_registration.sh'
      - 'scripts/validate_macos_callback_token.py'
      - 'scripts/verify_macos_url_handler.swift'
      - 'scripts/verify_macos_release_auth.sh'
      - 'scripts/validate_parakeet_runtime_recovery.swift'
      - 'scripts/validate_transcription_prompt_routing.py'
      - 'scripts/validate_transcription_cleanup_prompt.swift'
      - 'docs/audio-processing-failure-contract.md'
      - 'AGENTS.md'
      - '.github/workflows/apple-audio-recovery.yml'
      - '.github/workflows/release-macos.yml'
      - '.github/workflows/ios-appstore-connect.yml'

permissions:
  contents: read

concurrency:
  group: apple-audio-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Recovery contracts
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify checked out commit
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ]; then
            echo "Recovery contracts checked out $actual_sha instead of event commit $GITHUB_SHA." >&2
            exit 1
          fi

      - name: Validate macOS callback registration
        run: |
          python3 scripts/validate_macos_callback_token.py --self-test
          bash scripts/validate_macos_url_handler_registration.sh

      - name: Run deterministic recovery matrix
        run: bash scripts/validate_apple_audio_recovery.sh

  builds:
    name: macOS and iOS builds
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify checked out commit
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ]; then
            echo "Apple builds checked out $actual_sha instead of event commit $GITHUB_SHA." >&2
            exit 1
          fi

      - name: Build macOS universal app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Whishpermate/Whispermate.xcodeproj \
            -scheme Whispermate \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-macOS" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS simulator app and keyboard extension
        run: |
          set -euo pipefail
          xcodebuild \
            -project Whishpermate/Whispermate.xcodeproj \
            -scheme WhisperMateIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build
