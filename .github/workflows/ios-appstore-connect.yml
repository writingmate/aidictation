name: iOS App Store Connect

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: "Upload metadata and submit the build for App Review"
        required: false
        type: boolean
        default: false
      existing_build_number:
        description: "Submit an already uploaded build number instead of uploading a new IPA"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-appstore-connect-main
  cancel-in-progress: false

jobs:
  archive-and-upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 90

    env:
      AIDICTATION_FORCE_ENV_SECRETS: "1"
      AIDICTATION_REQUIRE_SECRETS: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      IOS_USE_AUTOMATIC_SIGNING: "1"
      KEEP_FASTLANE_BUILD_ARTIFACTS: "1"

      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}

      AUTH_WEB_URL: ${{ secrets.AUTH_WEB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CUSTOM_TRANSCRIPTION_ENDPOINT: ${{ secrets.CUSTOM_TRANSCRIPTION_ENDPOINT }}
      CUSTOM_TRANSCRIPTION_MODEL: ${{ secrets.CUSTOM_TRANSCRIPTION_MODEL }}
      CUSTOM_TRANSCRIPTION_KEY: ${{ secrets.CUSTOM_TRANSCRIPTION_KEY }}
      AIDICTATION_POST_PROCESSING_ENDPOINT: ${{ secrets.AIDICTATION_POST_PROCESSING_ENDPOINT }}
      AIDICTATION_POST_PROCESSING_KEY: ${{ secrets.AIDICTATION_POST_PROCESSING_KEY }}
      GROQ_TRANSCRIPTION_KEY: ${{ secrets.GROQ_TRANSCRIPTION_KEY }}
      GROQ_LLM_KEY: ${{ secrets.GROQ_LLM_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}
      STRIPE_PAYMENT_LINK_MONTHLY: ${{ secrets.STRIPE_PAYMENT_LINK_MONTHLY }}
      STRIPE_PAYMENT_LINK_ANNUAL: ${{ secrets.STRIPE_PAYMENT_LINK_ANNUAL }}
      STRIPE_PAYMENT_LINK_LIFETIME: ${{ secrets.STRIPE_PAYMENT_LINK_LIFETIME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        shell: bash
        run: gem install fastlane -v 2.237.0 --no-document

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          required=(
            APP_STORE_CONNECT_API_KEY_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_KEY_ID
            AUTH_WEB_URL
            SUPABASE_URL
            SUPABASE_ANON_KEY
            CUSTOM_TRANSCRIPTION_ENDPOINT
            CUSTOM_TRANSCRIPTION_MODEL
            CUSTOM_TRANSCRIPTION_KEY
            AIDICTATION_POST_PROCESSING_ENDPOINT
            AIDICTATION_POST_PROCESSING_KEY
          )

          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              missing=1
            fi
          done

          if [ -z "${APP_STORE_CONNECT_API_KEY_P8:-}" ] && [ -z "${APP_STORE_CONNECT_API_KEY_P8_BASE64:-}" ]; then
            echo "::error::Missing required secret: APP_STORE_CONNECT_API_KEY_P8 or APP_STORE_CONNECT_API_KEY_P8_BASE64"
            missing=1
          fi

          exit "${missing}"

      - name: Install App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail

          key_dir="${HOME}/.appstoreconnect/private_keys"
          key_path="${key_dir}/AuthKey_${APP_STORE_CONNECT_API_KEY_KEY_ID}.p8"
          mkdir -p "${key_dir}"

          if [ -n "${APP_STORE_CONNECT_API_KEY_P8_BASE64:-}" ]; then
            printf '%s' "${APP_STORE_CONNECT_API_KEY_P8_BASE64}" | base64 --decode > "${key_path}"
          else
            printf '%s' "${APP_STORE_CONNECT_API_KEY_P8}" > "${key_path}"
          fi

          chmod 600 "${key_path}"
          echo "APP_STORE_CONNECT_API_KEY_KEY=${key_path}" >> "${GITHUB_ENV}"

      - name: Resolve next App Store build number
        shell: bash
        run: |
          set -euo pipefail

          bundle_id="com.whispermate.ios"
          build_settings="$(xcodebuild -project Whishpermate/Whispermate.xcodeproj -scheme WhisperMateIOS -configuration Release -showBuildSettings)"
          marketing_version="$(printf '%s\n' "${build_settings}" | awk -F= '/^[[:space:]]*MARKETING_VERSION[[:space:]]*=/{ gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit }')"
          committed_build_number="$(printf '%s\n' "${build_settings}" | awk -F= '/^[[:space:]]*CURRENT_PROJECT_VERSION[[:space:]]*=/{ gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit }')"
          if [ -z "${marketing_version}" ] || [ -z "${committed_build_number}" ]; then
            echo "::error::Could not resolve MARKETING_VERSION or CURRENT_PROJECT_VERSION from Xcode build settings"
            exit 1
          fi

          if [ -n "${{ inputs.existing_build_number || '' }}" ]; then
            echo "Marketing version: ${marketing_version}"
            echo "Committed build number: ${committed_build_number}"
            echo "Using existing App Store Connect build number: ${{ inputs.existing_build_number }}"
            echo "IOS_MARKETING_VERSION=${marketing_version}" >> "${GITHUB_ENV}"
            echo "IOS_BUILD_NUMBER=${{ inputs.existing_build_number }}" >> "${GITHUB_ENV}"
            exit 0
          fi

          export BUNDLE_ID="${bundle_id}"
          export MARKETING_VERSION="${marketing_version}"

          latest_uploaded_build="$(node <<'NODE'
          const crypto = require("crypto");

          const keyId = process.env.APP_STORE_CONNECT_API_KEY_KEY_ID;
          const issuerId = process.env.APP_STORE_CONNECT_API_KEY_ISSUER_ID;
          const key = require("fs").readFileSync(process.env.APP_STORE_CONNECT_API_KEY_KEY, "utf8");
          const bundleId = process.env.BUNDLE_ID;
          const marketingVersion = process.env.MARKETING_VERSION;

          const base64url = (input) => Buffer.from(input)
            .toString("base64")
            .replace(/=/g, "")
            .replace(/\+/g, "-")
            .replace(/\//g, "_");

          const now = Math.floor(Date.now() / 1000);
          const header = { alg: "ES256", kid: keyId, typ: "JWT" };
          const payload = {
            iss: issuerId,
            iat: now,
            exp: now + 20 * 60,
            aud: "appstoreconnect-v1"
          };

          const signingInput = `${base64url(JSON.stringify(header))}.${base64url(JSON.stringify(payload))}`;
          const signature = crypto.sign("sha256", Buffer.from(signingInput), {
            key,
            dsaEncoding: "ieee-p1363"
          });
          const token = `${signingInput}.${base64url(signature)}`;

          async function request(path) {
            const response = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              headers: { Authorization: `Bearer ${token}` }
            });

            if (!response.ok) {
              const body = await response.text();
              throw new Error(`App Store Connect API ${response.status}: ${body}`);
            }

            return response.json();
          }

          (async () => {
            const appResponse = await request(`/v1/apps?filter[bundleId]=${encodeURIComponent(bundleId)}&limit=1`);
            const app = appResponse.data?.[0];
            if (!app) {
              throw new Error(`No App Store Connect app found for ${bundleId}`);
            }

            const buildResponse = await request(`/v1/builds?filter[app]=${encodeURIComponent(app.id)}&filter[preReleaseVersion.version]=${encodeURIComponent(marketingVersion)}&fields[builds]=version&limit=200`);
            const versions = (buildResponse.data || [])
              .map((build) => Number.parseInt(build.attributes?.version, 10))
              .filter(Number.isFinite);

            console.log(versions.length ? Math.max(...versions) : 0);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          )"

          next_build_number="$(node -e 'const committed = Number.parseInt(process.argv[1], 10) || 0; const uploaded = Number.parseInt(process.argv[2], 10) || 0; console.log(Math.max(committed, uploaded) + 1);' "${committed_build_number}" "${latest_uploaded_build}")"

          echo "Marketing version: ${marketing_version}"
          echo "Committed build number: ${committed_build_number}"
          echo "Latest App Store Connect build number: ${latest_uploaded_build}"
          echo "Next build number: ${next_build_number}"
          echo "IOS_MARKETING_VERSION=${marketing_version}" >> "${GITHUB_ENV}"
          echo "IOS_BUILD_NUMBER=${next_build_number}" >> "${GITHUB_ENV}"

      - name: Write app secrets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.existing_build_number == '' }}
        shell: bash
        run: ./ci_scripts/ci_pre_xcodebuild.sh

      - name: Prepare iOS signing assets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.existing_build_number == '' }}
        shell: bash
        run: ./ci_scripts/prepare_ios_signing.js

      - name: Archive iOS app
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.existing_build_number == '' }}
        shell: bash
        working-directory: Whishpermate
        run: fastlane ios build

      - name: Validate IPA signing
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.existing_build_number == '' }}
        shell: bash
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          unzip -q Whishpermate/build/WhisperMate.ipa -d "${tmp_dir}"
          app_path="${tmp_dir}/Payload/WhisperMateIOS.app"

          if [ ! -d "${app_path}" ]; then
            echo "::error::WhisperMateIOS.app was not found in the exported IPA"
            exit 1
          fi

          authority="$(codesign -dvv "${app_path}" 2>&1 | awk -F= '/^Authority=/{print $2; exit}')"
          echo "Signing authority: ${authority}"

          if [[ "${authority}" != Apple\ Distribution:* && "${authority}" != iPhone\ Distribution:* ]]; then
            echo "::error::IPA must be signed with an Apple/iPhone Distribution certificate for App Store upload"
            exit 1
          fi

      - name: Upload IPA to App Store Connect
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.existing_build_number == '' }}
        shell: bash
        run: |
          set -euo pipefail

          xcrun altool \
            --upload-app \
            --type ios \
            --file Whishpermate/build/WhisperMate.ipa \
            --apiKey "${APP_STORE_CONNECT_API_KEY_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_API_KEY_ISSUER_ID}"

      - name: Submit to App Review
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.submit_for_review }}
        shell: bash
        run: node ci_scripts/submit_ios_app_review.js

      - name: Upload IPA artifact
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.existing_build_number == '') }}
        uses: actions/upload-artifact@v4
        with:
          name: WhisperMate-iOS-${{ github.run_number }}
          path: Whishpermate/build/WhisperMate.ipa
          if-no-files-found: ignore
