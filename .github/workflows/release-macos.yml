name: Release macOS

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  provenance:
    name: Verify release provenance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify release commit is on main
        run: |
          actual_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")"
          if [ "$actual_sha" != "$GITHUB_SHA" ] || [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release checkout ($actual_sha) or tag ($tag_sha) does not match event commit $GITHUB_SHA." >&2
            exit 1
          fi
          git fetch origin main --prune
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} is not based on origin/main." >&2
            echo "Merge the release commit to main before tagging it." >&2
            exit 1
          fi

  release:
    needs: provenance
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify tagged source checkout
        run: |
          actual_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")"
          if [ "$actual_sha" != "$GITHUB_SHA" ] || [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release checkout ($actual_sha) or tag ($tag_sha) does not match event commit $GITHUB_SHA." >&2
            exit 1
          fi

      - name: Extract version info
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must match v<major>.<minor>.<patch>; got $GITHUB_REF_NAME." >&2
            exit 1
          fi
          TAG="${BASH_REMATCH[1]}"
          BUILD="${TAG##*.}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v$TAG" >> "$GITHUB_OUTPUT"

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Whispermate-*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Whishpermate/Whispermate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/certificate.p12

      - name: Install Secrets.plist
        env:
          SECRETS_PLIST: ${{ secrets.SECRETS_PLIST }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          AUTH_WEB_URL: ${{ secrets.AUTH_WEB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SENTRY_DSN"
          test -n "$AUTH_WEB_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          echo "$SECRETS_PLIST" | base64 --decode > Whishpermate/Whispermate/Secrets.plist
          for key in AUTH_WEB_URL SUPABASE_URL SUPABASE_ANON_KEY; do
            /usr/libexec/PlistBuddy -c "Delete :$key" Whishpermate/Whispermate/Secrets.plist 2>/dev/null || true
            value=$(printenv "$key")
            /usr/libexec/PlistBuddy -c "Add :$key string $value" Whishpermate/Whispermate/Secrets.plist
          done
          /usr/libexec/PlistBuddy -c "Delete :SentryDSN" Whishpermate/Whispermate/Secrets.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :SentryDSN string $SENTRY_DSN" Whishpermate/Whispermate/Secrets.plist
          /usr/libexec/PlistBuddy -c "Print :SentryDSN" Whishpermate/Whispermate/Secrets.plist >/dev/null

      - name: Validate release transcription secret
        run: |
          python3 scripts/validate_transcription_prompt_routing.py
          swiftc \
            -module-cache-path /tmp/aidictation-swift-module-cache \
            Whishpermate/WhisperMateShared/Networking/TranscriptionCleanupPrompt.swift \
            scripts/validate_transcription_cleanup_prompt.swift \
            -o /tmp/validate_transcription_cleanup_prompt
          /tmp/validate_transcription_cleanup_prompt
          python3 scripts/validate_release_transcription_config.py \
            --secrets Whishpermate/Whispermate/Secrets.plist \
            --config-only

      - name: Validate audio recovery contracts
        run: bash scripts/validate_apple_audio_recovery.sh

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Whishpermate/Whispermate.xcodeproj \
            -scheme Whispermate

      - name: Verify release build settings
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Tracked source changed after checking out release tag ${GITHUB_REF_NAME}." >&2
            git status --short >&2
            exit 1
          fi
          xcodebuild \
            -project Whishpermate/Whispermate.xcodeproj \
            -scheme Whispermate \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -showBuildSettings \
            -json \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            > /tmp/release-build-settings.json
          python3 - "$VERSION" "$BUILD" <<'PYEOF'
          import json
          import sys

          expected_version, expected_build = sys.argv[1:]
          with open("/tmp/release-build-settings.json", encoding="utf-8") as settings_file:
              targets = json.load(settings_file)
          if not targets:
              raise SystemExit("xcodebuild returned no archived targets")

          mismatches = []
          for target in targets:
              name = target.get("target", "<unknown>")
              settings = target.get("buildSettings", {})
              actual_version = settings.get("MARKETING_VERSION")
              actual_build = settings.get("CURRENT_PROJECT_VERSION")
              if (actual_version, actual_build) != (expected_version, expected_build):
                  mismatches.append(
                      f"{name}: MARKETING_VERSION={actual_version!r}, "
                      f"CURRENT_PROJECT_VERSION={actual_build!r}"
                  )
          if mismatches:
              raise SystemExit(
                  "release version overrides did not reach every archived target:\n"
                  + "\n".join(mismatches)
              )
          print(
              f"verified {len(targets)} archived target(s) at "
              f"{expected_version} ({expected_build})"
          )
          PYEOF

      - name: Build archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          xcodebuild \
            -project Whishpermate/Whispermate.xcodeproj \
            -scheme Whispermate \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath /tmp/AIDictation.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=G7DJ6P37KU \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            archive

      - name: Verify archive kept tagged source unchanged
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Tracked source changed while archiving release tag ${GITHUB_REF_NAME}." >&2
            git status --short >&2
            exit 1
          fi

      - name: Export with Developer ID signing
        run: |
          cat > /tmp/export-options.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>G7DJ6P37KU</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath /tmp/AIDictation.xcarchive \
            -exportOptionsPlist /tmp/export-options.plist \
            -exportPath /tmp/AIDictation-export

      - name: Validate exported app behavior
        env:
          AIDICTATION_RELEASE_TEST_EMAIL: ${{ secrets.AIDICTATION_RELEASE_TEST_EMAIL }}
          AIDICTATION_RELEASE_TEST_PASSWORD: ${{ secrets.AIDICTATION_RELEASE_TEST_PASSWORD }}
        run: |
          APP=/tmp/AIDictation-export/AIDictation.app
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          INFO_PLIST="$APP/Contents/Info.plist"
          packaged_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")"
          packaged_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")"
          if [ "$packaged_version" != "$VERSION" ] || [ "$packaged_build" != "$BUILD" ]; then
            echo "Packaged app is $packaged_version ($packaged_build), expected $VERSION ($BUILD)." >&2
            exit 1
          fi
          scripts/validate_macos_universal_app.sh "$APP"
          python3 scripts/validate_release_transcription_config.py \
            --secrets "$APP/Contents/Resources/Secrets.plist" \
            --require-auth \
            --require-lifetime
          swiftc \
            Whishpermate/Whispermate/Services/TextInsertionFormatter.swift \
            scripts/validate_text_insertion_formatter.swift \
            -o /tmp/validate_text_insertion_formatter
          /tmp/validate_text_insertion_formatter
          swift scripts/validate_parakeet_runtime.swift "$APP"

      - name: Notarize app
        env:
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            /tmp/AIDictation-export/AIDictation.app \
            /tmp/AIDictation-notarize.zip
          xcrun notarytool submit /tmp/AIDictation-notarize.zip \
            --apple-id "$NOTARIZE_APPLE_ID" \
            --password "$NOTARIZE_PASSWORD" \
            --team-id "$NOTARIZE_TEAM_ID" \
            --wait
          xcrun stapler staple /tmp/AIDictation-export/AIDictation.app
          rm /tmp/AIDictation-notarize.zip

      - name: Install live browser verifier
        run: |
          npm install --prefix /tmp/aidictation-release-browser playwright@1.55.0
          /tmp/aidictation-release-browser/node_modules/.bin/playwright install chromium
          cp scripts/capture_release_auth_callback.mjs /tmp/aidictation-release-browser/

      - name: Verify release app browser sign-in and lifetime access
        env:
          AIDICTATION_RELEASE_TEST_EMAIL: ${{ secrets.AIDICTATION_RELEASE_TEST_EMAIL }}
          AIDICTATION_RELEASE_TEST_PASSWORD: ${{ secrets.AIDICTATION_RELEASE_TEST_PASSWORD }}
        run: |
          bash scripts/verify_macos_release_auth.sh \
            /tmp/AIDictation-export/AIDictation.app \
            "${{ steps.version.outputs.version }}"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          create-dmg \
            --volname "AIDictation" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 160 \
            --icon "AIDictation.app" 180 170 \
            --hide-extension "AIDictation.app" \
            --app-drop-link 480 170 \
            --no-internet-enable \
            /tmp/AIDictation-v${VERSION}.dmg \
            /tmp/AIDictation-export/AIDictation.app

      - name: Notarize and staple DMG
        env:
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          xcrun notarytool submit /tmp/AIDictation-v${VERSION}.dmg \
            --apple-id "$NOTARIZE_APPLE_ID" \
            --password "$NOTARIZE_PASSWORD" \
            --team-id "$NOTARIZE_TEAM_ID" \
            --wait
          xcrun stapler staple /tmp/AIDictation-v${VERSION}.dmg
          xcrun stapler validate /tmp/AIDictation-v${VERSION}.dmg
          hdiutil verify /tmp/AIDictation-v${VERSION}.dmg

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          DMG="/tmp/AIDictation-v${VERSION}.dmg"
          actual_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "refs/tags/$TAG")"
          if [ "$actual_sha" != "$GITHUB_SHA" ] || [ "$tag_sha" != "$GITHUB_SHA" ] \
            || ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Refusing to publish artifacts not built from event commit $GITHUB_SHA." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber --repo "${{ github.repository }}"
            gh release edit "$TAG" --title "AIDictation v${VERSION}" --repo "${{ github.repository }}"
          else
            gh release create "$TAG" \
              "$DMG" \
              --title "AIDictation v${VERSION}" \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi

      - name: Verify public release asset
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LOCAL_DMG="/tmp/AIDictation-v${VERSION}.dmg"
          PUBLIC_DMG="/tmp/AIDictation-v${VERSION}-public.dmg"
          PUBLIC_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/AIDictation-v${VERSION}.dmg"

          for attempt in {1..12}; do
            if curl --fail --location --silent --show-error "$PUBLIC_URL" --output "$PUBLIC_DMG"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Published DMG did not become available at $PUBLIC_URL." >&2
              exit 1
            fi
            sleep 5
          done

          local_sha="$(shasum -a 256 "$LOCAL_DMG" | awk '{print $1}')"
          public_sha="$(shasum -a 256 "$PUBLIC_DMG" | awk '{print $1}')"
          if [ "$local_sha" != "$public_sha" ]; then
            echo "Published DMG checksum does not match the notarized release artifact." >&2
            exit 1
          fi

          xcrun stapler validate "$PUBLIC_DMG"
          hdiutil verify "$PUBLIC_DMG"

          MOUNT_POINT="/tmp/AIDictation-v${VERSION}-mount"
          PUBLISHED_APP="/tmp/AIDictation-published.app"
          mkdir -p "$MOUNT_POINT"
          cleanup_mount() {
            hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_POINT" "$PUBLIC_DMG"
          ditto "$MOUNT_POINT/AIDictation.app" "$PUBLISHED_APP"
          cleanup_mount
          trap - EXIT

          codesign --verify --deep --strict --verbose=2 "$PUBLISHED_APP"
          spctl --assess --type execute --verbose=4 "$PUBLISHED_APP"
          scripts/validate_macos_universal_app.sh "$PUBLISHED_APP"

          INFO_PLIST="$PUBLISHED_APP/Contents/Info.plist"
          packaged_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")"
          packaged_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")"
          callback_scheme="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$INFO_PLIST")"
          if [ "$packaged_version" != "$VERSION" ] || [ "$packaged_build" != "${{ steps.version.outputs.build }}" ]; then
            echo "Published app is $packaged_version ($packaged_build), expected $VERSION (${{ steps.version.outputs.build }})." >&2
            exit 1
          fi
          if [ "$callback_scheme" != "aidictation" ]; then
            echo "Published app does not register the aidictation browser callback scheme." >&2
            exit 1
          fi
          echo "Verified published AIDictation v${VERSION} asset with SHA-256 ${public_sha}."

      - name: Verify published browser sign-in and lifetime access
        env:
          AIDICTATION_RELEASE_TEST_EMAIL: ${{ secrets.AIDICTATION_RELEASE_TEST_EMAIL }}
          AIDICTATION_RELEASE_TEST_PASSWORD: ${{ secrets.AIDICTATION_RELEASE_TEST_PASSWORD }}
        run: |
          bash scripts/verify_macos_release_auth.sh \
            /tmp/AIDictation-published.app \
            "${{ steps.version.outputs.version }}"

      - name: Update appcast
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          REPO="${{ github.repository }}"
          SPARKLE_GENERATE_APPCAST="$(
            find "$HOME/Library/Developer/Xcode/DerivedData" \
              -path '*/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast' \
              -type f \
              -print \
              -quit
          )"
          if [[ ! -x "$SPARKLE_GENERATE_APPCAST" ]]; then
            echo "Sparkle generate_appcast tool not found"
            exit 1
          fi

          APPCAST_WORK_DIR="$(mktemp -d)"
          cp appcast.xml "$APPCAST_WORK_DIR/appcast.xml"
          cp "/tmp/AIDictation-v${VERSION}.dmg" "$APPCAST_WORK_DIR/"

          "$SPARKLE_GENERATE_APPCAST" \
            --download-url-prefix "https://github.com/${REPO}/releases/download/v${VERSION}/" \
            --maximum-versions 0 \
            --maximum-deltas 0 \
            "$APPCAST_WORK_DIR"

          cp "$APPCAST_WORK_DIR/appcast.xml" appcast.xml
          xmllint --noout appcast.xml

          python3 - "$VERSION" "$BUILD" << 'PYEOF'
          import sys
          import xml.etree.ElementTree as ET

          version, build = sys.argv[1:]
          namespaces = {"sparkle": "http://www.andymatuschak.org/xml-namespaces/sparkle"}
          root = ET.parse("appcast.xml").getroot()
          first_item = root.find("./channel/item")
          if first_item is None:
              raise SystemExit("appcast has no items")

          minimum_os = first_item.findtext("sparkle:minimumSystemVersion", namespaces=namespaces)
          sparkle_version = first_item.findtext("sparkle:version", namespaces=namespaces)
          short_version = first_item.findtext("sparkle:shortVersionString", namespaces=namespaces)

          if minimum_os != "13.0":
              raise SystemExit(f"expected macOS minimum 13.0, got {minimum_os!r}")
          if sparkle_version != build:
              raise SystemExit(f"expected sparkle version {build}, got {sparkle_version!r}")
          if short_version != version:
              raise SystemExit(f"expected short version {version}, got {short_version!r}")

          enclosure = first_item.find("enclosure")
          if enclosure is None or f"AIDictation-v{version}.dmg" not in enclosure.attrib.get("url", ""):
              raise SystemExit("top appcast enclosure does not point at this release DMG")

          print(f"appcast validated for v{version} (build {build}, macOS {minimum_os})")
          PYEOF

          unexpected_changes="$(git diff --name-only -- . ':(exclude)appcast.xml')"
          if [ -n "$unexpected_changes" ]; then
            echo "Only appcast.xml may change after building release tag ${GITHUB_REF_NAME}." >&2
            printf '%s\n' "$unexpected_changes" >&2
            exit 1
          fi

      - name: Commit appcast to main
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp appcast.xml /tmp/appcast.xml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -B release-feed-update FETCH_HEAD

          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "No appcast changes to commit"
            exit 0
          fi
          git commit -m "update appcast for v${VERSION} release"
          git push origin HEAD:main
