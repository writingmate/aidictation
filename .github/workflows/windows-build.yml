name: Windows Build

on:
  push:
    branches: [ main ]
    tags:
      - 'windows-v*'
    paths:
      - 'AIDictation.Windows/**'
      - 'docs/audio-processing-failure-contract.md'
      - 'AGENTS.md'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'AIDictation.Windows/**'
      - 'docs/audio-processing-failure-contract.md'
      - 'AGENTS.md'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'AIDictation.Windows/AIDictation/AIDictation.csproj'
  PUBLISH_DIR: 'AIDictation.Windows/artifacts/win-x64'
  INSTALLER_DIR: 'AIDictation.Windows/artifacts/installer'

jobs:
  provenance:
    name: Verify build provenance
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify trusted ref
      shell: bash
      run: |
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          exit 0
        fi
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "Manual builds must run from main, not $GITHUB_REF." >&2
          exit 1
        fi
        git fetch origin main --prune
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "Build commit $GITHUB_SHA is not based on origin/main." >&2
          exit 1
        fi

  build:
    needs: provenance
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Validate audio recovery contracts
      shell: pwsh
      run: pwsh -File AIDictation.Windows/scripts/validate-audio-recovery.ps1

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

    - name: Publish
      run: >
        dotnet publish ${{ env.PROJECT_PATH }}
        --configuration Release
        --runtime win-x64
        --self-contained true
        --output ${{ env.PUBLISH_DIR }}
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:EnableCompressionInSingleFile=true

    - name: Smoke test published app
      shell: pwsh
      run: |
        $exe = Join-Path "${{ env.PUBLISH_DIR }}" "AIDictation.exe"
        if (-not (Test-Path $exe)) {
          throw "Published executable missing: $exe"
        }
        $file = Get-Item $exe
        if ($file.Length -lt 10MB) {
          throw "Published executable is unexpectedly small: $($file.Length) bytes"
        }
        $process = Start-Process -FilePath $exe -PassThru
        Start-Sleep -Seconds 5
        if ($process.HasExited -and $process.ExitCode -ne 0) {
          throw "AIDictation exited during smoke test with code $($process.ExitCode)"
        }
        if (-not $process.HasExited) {
          Stop-Process -Id $process.Id -Force
        }

    - name: Install Inno Setup
      shell: pwsh
      run: choco install innosetup --no-progress --yes

    - name: Build classic Windows installer
      shell: pwsh
      run: >
        AIDictation.Windows/scripts/build-installer.ps1
        -ProjectPath ${{ env.PROJECT_PATH }}
        -PublishDir ${{ env.PUBLISH_DIR }}
        -InstallerDir ${{ env.INSTALLER_DIR }}

    - name: Smoke test installer metadata
      shell: pwsh
      run: |
        $installer = Get-ChildItem "${{ env.INSTALLER_DIR }}" -Filter "AIDictation-Windows-Setup-v*.exe" | Select-Object -First 1
        if (-not $installer) {
          throw "Installer artifact missing"
        }
        if ($installer.Length -lt 10MB) {
          throw "Installer is unexpectedly small: $($installer.Length) bytes"
        }
        Write-Host "Installer: $($installer.FullName)"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIDictation-Windows-x64
        path: ${{ env.PUBLISH_DIR }}/
        retention-days: 30

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIDictation-Windows-Installer
        path: ${{ env.INSTALLER_DIR }}/*.exe
        retention-days: 30

  release:
    needs: [provenance, build]
    runs-on: windows-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/windows-v')
    permissions:
      contents: write
    env:
      # Release-only configuration baked into AssemblyMetadata by MSBuild.
      TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
      TRANSCRIPTION_ENDPOINT: ${{ secrets.TRANSCRIPTION_ENDPOINT }}
      TRANSCRIPTION_MODEL: ${{ secrets.TRANSCRIPTION_MODEL }}
      AIDICTATION_POST_PROCESSING_KEY: ${{ secrets.AIDICTATION_POST_PROCESSING_KEY }}
      AIDICTATION_POST_PROCESSING_ENDPOINT: ${{ secrets.AIDICTATION_POST_PROCESSING_ENDPOINT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      AUTH_WEB_URL: ${{ secrets.AUTH_WEB_URL }}
      STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Get version
      id: version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag -replace '^windows-v', ''
        if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
          throw "Windows release tags must look like windows-v0.0.1 or windows-v0.0.1.2"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Install Inno Setup
      shell: pwsh
      run: choco install innosetup --no-progress --yes

    - name: Publish Release Build
      shell: pwsh
      run: >
        AIDictation.Windows/scripts/build-installer.ps1
        -ProjectPath ${{ env.PROJECT_PATH }}
        -PublishDir ./release
        -InstallerDir ./installer
        -Version ${{ steps.version.outputs.VERSION }}

    - name: Create ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path ./release/* -DestinationPath ./AIDictation-Windows-v${{ steps.version.outputs.VERSION }}.zip

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIDictation-Windows-Release-v${{ steps.version.outputs.VERSION }}
        path: ./AIDictation-Windows-v${{ steps.version.outputs.VERSION }}.zip
        retention-days: 90

    - name: Upload Release Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIDictation-Windows-Setup-v${{ steps.version.outputs.VERSION }}
        path: ./installer/AIDictation-Windows-Setup-v${{ steps.version.outputs.VERSION }}.exe
        retention-days: 90

    - name: Publish GitHub Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $tag = "${{ github.ref_name }}"
        $zip = "./AIDictation-Windows-v$version.zip"
        $installer = "./installer/AIDictation-Windows-Setup-v$version.exe"
        $notes = @"
        Classic Windows installer and portable ZIP for AIDictation Windows v$version.

        Built automatically from release tag $tag.
        "@

        gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
        if ($LASTEXITCODE -eq 0) {
          gh release upload $tag $installer $zip --clobber --repo $env:GITHUB_REPOSITORY
          gh release edit $tag --title "AIDictation Windows v$version" --notes $notes --repo $env:GITHUB_REPOSITORY
        } else {
          gh release create $tag $installer $zip `
            --title "AIDictation Windows v$version" `
            --notes $notes `
            --repo $env:GITHUB_REPOSITORY
        }
