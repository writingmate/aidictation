name: Windows RDP via Tailscale

on:
  push:
    branches:
      - windows-gh-smoke
    paths:
      - '.github/workflows/windows-rdp-tailscale.yml'
      - 'AIDictation.Windows/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'AIDictation.Windows/AIDictation/AIDictation.csproj'
  PUBLISH_DIR: './publish-rdp'

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Validate Tailscale auth key secret
      shell: pwsh
      env:
        TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
          throw "Missing repository secret TAILSCALE_AUTHKEY. Add a reusable ephemeral Tailscale auth key before running this workflow."
        }

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

    - name: Publish
      run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ${{ env.PUBLISH_DIR }} --self-contained true -r win-x64 -p:PublishSingleFile=true

    - name: Connect runner to Tailscale
      uses: tailscale/github-action@v4
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
        version: latest

    - name: Enable RDP and generate credentials
      id: rdp
      shell: pwsh
      run: |
        $password = -join ((48..57) + (65..90) + (97..122) + 33,35,36,37,64 | Get-Random -Count 20 | ForEach-Object {[char]$_})
        net user runneradmin $password
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
        Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
        Start-Service -Name TermService
        "password=$password" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Start published app
      shell: pwsh
      run: |
        $appPath = Resolve-Path '${{ env.PUBLISH_DIR }}/AIDictation.exe'
        Start-Process -FilePath $appPath

    - name: Print Tailscale RDP details
      shell: pwsh
      run: |
        $ip = tailscale ip -4 | Select-Object -First 1
        $appPath = Resolve-Path '${{ env.PUBLISH_DIR }}/AIDictation.exe'

        Write-Host "Tailscale IP: $ip"
        Write-Host "RDP target: $ip:3389"
        Write-Host "RDP username: runneradmin"
        Write-Host "RDP password: ${{ steps.rdp.outputs.password }}"
        Write-Host "Published app path: $appPath"

        @"
        Tailscale IP:
        $ip

        RDP target:
        $ip:3389

        Username:
        runneradmin

        Password:
        ${{ steps.rdp.outputs.password }}

        Published app path:
        $appPath
        "@ | Set-Content -Path tailscale-rdp-connection.txt

    - name: Upload connection bundle
      uses: actions/upload-artifact@v4
      with:
        name: tailscale-rdp-connection
        path: tailscale-rdp-connection.txt
        retention-days: 1

    - name: Keep Windows runner alive for Tailscale RDP
      shell: pwsh
      run: |
        Write-Host "Tailscale RDP session is available for 60 minutes."
        Start-Sleep -Seconds 3600
