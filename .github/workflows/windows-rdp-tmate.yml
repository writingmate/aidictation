name: Windows RDP via tunnel

on:
  push:
    branches:
      - codex/windows-actions-smoke
    paths:
      - '.github/workflows/windows-rdp-tmate.yml'
  workflow_dispatch:
    inputs:
      hold_minutes:
        description: 'How long to keep the Windows runner alive'
        required: true
        default: '60'
        type: choice
        options:
          - '30'
          - '60'
          - '120'

permissions:
  contents: read
  pull-requests: write

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'AIDictation.Windows/AIDictation/AIDictation.csproj'
  PUBLISH_DIR: 'AIDictation.Windows/artifacts/win-x64'

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Windows app
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ${{ env.PUBLISH_DIR }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Enable RDP user
        shell: pwsh
        run: |
          $password = "RdpTest#${{ github.run_id }}aZ9"
          net user aidictation "$password" /add /Y
          net localgroup administrators aidictation /add
          net localgroup "Remote Desktop Users" aidictation /add
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          echo "RDP_USER=aidictation" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Print RDP details
        shell: pwsh
        run: |
          Write-Host "RDP user: $env:RDP_USER"
          Write-Host "RDP password: $env:RDP_PASSWORD"
          Write-Host "Published app path on runner: $env:GITHUB_WORKSPACE\$env:PUBLISH_DIR\AIDictation.exe"

      - name: Start public RDP TCP tunnel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $stdoutLog = "$env:RUNNER_TEMP\pinggy-rdp.out.log"
          $stderrLog = "$env:RUNNER_TEMP\pinggy-rdp.err.log"
          $detailsFile = "$env:RUNNER_TEMP\rdp-details.md"
          $args = @(
            "-y",
            "pinggy",
            "-p", "443",
            "-R0:127.0.0.1:3389",
            "tcp@free.pinggy.io",
            "--loglevel", "INFO",
            "--v"
          )
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo.FileName = "npx.cmd"
          foreach ($arg in $args) {
            [void]$process.StartInfo.ArgumentList.Add($arg)
          }
          $process.StartInfo.UseShellExecute = $false
          $process.StartInfo.RedirectStandardOutput = $true
          $process.StartInfo.RedirectStandardError = $true
          $process.EnableRaisingEvents = $true
          $outputWriter = [System.IO.StreamWriter]::new($stdoutLog, $false)
          $errorWriter = [System.IO.StreamWriter]::new($stderrLog, $false)
          $process.add_OutputDataReceived({
            if ($EventArgs.Data) {
              $script:outputWriter.WriteLine($EventArgs.Data)
              $script:outputWriter.Flush()
            }
          })
          $process.add_ErrorDataReceived({
            if ($EventArgs.Data) {
              $script:errorWriter.WriteLine($EventArgs.Data)
              $script:errorWriter.Flush()
            }
          })
          [void]$process.Start()
          $process.BeginOutputReadLine()
          $process.BeginErrorReadLine()
          echo "PINGGY_PID=$($process.Id)" >> $env:GITHUB_ENV
          Start-Sleep -Seconds 30
          if (Test-Path $stdoutLog) { Get-Content $stdoutLog }
          if (Test-Path $stderrLog) { Get-Content $stderrLog }
          $stdout = if (Test-Path $stdoutLog) { Get-Content $stdoutLog -Raw } else { "" }
          $stderr = if (Test-Path $stderrLog) { Get-Content $stderrLog -Raw } else { "" }
          Write-Host ""
          Write-Host "Use the printed Pinggy TCP address above in Microsoft Remote Desktop."
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASSWORD"
          @"
          Windows RDP runner is ready.

          Use the Pinggy TCP address below in Microsoft Remote Desktop.

          Username: $env:RDP_USER
          Password: $env:RDP_PASSWORD

          Published app path:
          `$env:GITHUB_WORKSPACE\$env:PUBLISH_DIR\AIDictation.exe`

          Tunnel output:
          ```text
          $stdout
          $stderr
          ```
          "@ | Set-Content -Path $detailsFile
          gh pr comment 28 --repo writingmate/aidictation --body-file $detailsFile

      - name: Keep runner alive
        shell: pwsh
        run: |
          $holdMinutes = "${{ inputs.hold_minutes }}"
          if ([string]::IsNullOrWhiteSpace($holdMinutes)) {
            $holdMinutes = "60"
          }
          Start-Sleep -Seconds ([int]$holdMinutes * 60)
          if ($env:PINGGY_PID) {
            Stop-Process -Id ([int]$env:PINGGY_PID) -Force -ErrorAction SilentlyContinue
          }
